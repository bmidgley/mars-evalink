# Mosquitto config for evalink.
#
# Auth is disabled: only trusted local clients should reach this broker.
# Restrict host port binding and firewall rules so 1883 is not exposed
# to the public internet.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
